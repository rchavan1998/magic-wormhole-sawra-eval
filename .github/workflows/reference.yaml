# >>> IS IDENTIFIER
# name: Tests

# >>> IS TRIGGER
on:
  push:
    branches: [ reference ]
  pull_request:
    branches: [ reference ]

jobs:
  testing:
    # >>> USE MATRIX
    # runs-on: ubuntu-latest
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

        # >>> USE MATRIX
        os: [ubuntu-latest]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: "0"
        ref: "${{ github.event.pull_request.head.sha || github.sha }}"

    # >>> IS IDENTIFIER
    # - name: Set up Python
    - uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    # >>> IS IDENTIFIER
    # - name: Install dependencies
    - run: |
        python -m pip install --upgrade pip tox codecov cuvner
    
    # >>> IS IDENTIFIER
    # - name: Test
    - run: |
        python --version
        tox -e coverage
    
    # >>> NEEDS GITHUB
    # - name: PR Coverage Graph
    #   shell: bash
    #   run: git diff origin/master..HEAD | cuv diff -
    #   continue-on-error: true

  flake8:
    # >>> USE MATRIX
    # runs-on: ubuntu-latest
    runs-on: ${{ matrix.os }}

    # >>> USE MATRIX
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      # >>> IS IDENTIFIER
      # - name: Set up Python
      - uses: actions/setup-python@v4

      # >>> IS IDENTIFIER
      # - name: Install dependencies
      - run: |
          python -m pip install --upgrade pip tox

      # >>> IS IDENTIFIER
      # - name: Flake8
      - run: |
          python --version
          tox -e flake8less


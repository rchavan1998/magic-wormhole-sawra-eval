name: CI

on: [push, pull_request]

jobs:
  testing:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: |
          pip install tox==4.28.0
      - run: |
          python -m pip install --upgrade pip tox codecov cuvner
      - run: |
          python --version
      - run: |
          tox -e coverage
    env:
      LC_ALL: C.utf8

  flake8:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: |
          pip install tox==4.28.0
      - run: |
          python -m pip install --upgrade pip tox
      - run: |
          python --version
      - run: |
          tox -e flake8less